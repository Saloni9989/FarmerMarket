<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Krishi Market</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="auth-body">
  <div class="auth-container" style="max-width:960px">
    <div class="auth-left">
      <a href="index.html" class="nav-logo"><i class="fas fa-seedling"></i><span>Krishi<span class="green">Market</span></span></a>
      <h2>Join Krishi Market</h2>
      <p>Register as a consumer to buy fresh produce or as a farmer to sell your crops directly.</p>
      <div class="auth-illustration">
        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=500&auto=format&fit=crop" alt="Farm" />
        <div class="auth-features">
          <div class="auth-feature"><i class="fas fa-check-circle"></i> Free to join</div>
          <div class="auth-feature"><i class="fas fa-check-circle"></i> Secure platform</div>
          <div class="auth-feature"><i class="fas fa-check-circle"></i> Trusted by 10,000+ users</div>
        </div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-form-wrapper" style="max-width:400px">
        <h3>Create Account</h3>
        <p class="auth-subtitle">Already registered? <a href="login.html">Sign in here</a></p>

        <!-- Role Selector -->
        <div class="role-tabs">
          <button class="role-tab active" id="tab-consumer" onclick="setRole('consumer')">
            <i class="fas fa-user"></i> Consumer
          </button>
          <button class="role-tab" id="tab-farmer" onclick="setRole('farmer')">
            <i class="fas fa-tractor"></i> Farmer
          </button>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <input type="hidden" id="roleInput" value="consumer" />

          <div class="form-group">
            <label>Full Name</label>
            <div class="input-with-icon">
              <i class="fas fa-user"></i>
              <input type="text" id="name" placeholder="Your full name" required />
            </div>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <div class="input-with-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <div class="input-with-icon">
              <i class="fas fa-phone"></i>
              <input type="tel" id="phone" placeholder="+91 98765 43210" />
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-with-icon">
              <i class="fas fa-lock"></i>
              <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" />
              <button type="button" class="eye-btn" onclick="togglePwd()">
                <i class="fas fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-with-icon">
              <i class="fas fa-lock"></i>
              <input type="password" id="confirmPassword" placeholder="Repeat your password" required />
            </div>
          </div>

          <!-- Farmer-specific fields -->
          <div id="farmerFields" style="display:none">
            <div class="form-group">
              <label>Farm Name</label>
              <div class="input-with-icon">
                <i class="fas fa-leaf"></i>
                <input type="text" id="farmName" placeholder="e.g. Green Valley Farm" />
              </div>
            </div>
            <div class="form-group">
              <label>Farm State</label>
              <select id="farmState">
                <option value="">Select State</option>
                <option>Andhra Pradesh</option><option>Assam</option><option>Bihar</option>
                <option>Gujarat</option><option>Haryana</option><option>Himachal Pradesh</option>
                <option>Karnataka</option><option>Kerala</option><option>Madhya Pradesh</option>
                <option>Maharashtra</option><option>Odisha</option><option>Punjab</option>
                <option>Rajasthan</option><option>Tamil Nadu</option><option>Telangana</option>
                <option>Uttar Pradesh</option><option>Uttarakhand</option><option>West Bengal</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom:20px">
            <label class="remember-me">
              <input type="checkbox" id="terms" required />
              I agree to the <a href="#" style="color:var(--primary)">Terms of Service</a>
            </label>
          </div>

          <button type="submit" class="btn-auth" id="registerBtn">
            <span id="registerBtnText">Create Account</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = 'index.html';

    // Set role from URL param
    const urlRole = new URLSearchParams(window.location.search).get('role');
    if (urlRole === 'farmer') setRole('farmer');

    function setRole(role) {
      document.getElementById('roleInput').value = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + role).classList.add('active');
      document.getElementById('farmerFields').style.display = role === 'farmer' ? 'block' : 'none';
      if (role === 'farmer') {
        document.getElementById('farmName').required = true;
        document.getElementById('farmState').required = true;
      } else {
        document.getElementById('farmName').required = false;
        document.getElementById('farmState').required = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password !== confirm) {
        showToast('Passwords do not match', 'error');
        return;
      }

      const btn = document.getElementById('registerBtn');
      const btnText = document.getElementById('registerBtnText');
      btn.disabled = true;
      btnText.textContent = 'Creating account...';

      const role = document.getElementById('roleInput').value;

      try {
        const data = await api.post('/auth/register', {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          password,
          role
        });

        Auth.save(data.token, data.user);
        showToast('Account created successfully!', 'success');

        // If farmer, also create profile
        if (role === 'farmer') {
          const farmName = document.getElementById('farmName').value;
          const farmState = document.getElementById('farmState').value;
          if (farmName && farmState) {
            try {
              await api.post('/farmers/register', {
                farmName,
                farmLocation: { state: farmState },
                farmingMethods: ['conventional'],
                cropTypes: ['vegetables']
              });
            } catch(e) { /* Profile will be created from dashboard */ }
          }
          setTimeout(() => window.location.href = 'farmer-dashboard.html', 1200);
        } else {
          setTimeout(() => window.location.href = 'index.html', 1200);
        }
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btnText.textContent = 'Create Account';
      }
    }

    function togglePwd() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    }
  </script>
</body>
</html>
